name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

env:
  IMAGE_NAME: onlinebookstore
  IMAGE_TAG: ${{ github.sha }}
  LOG_DIR: ci-logs

# ============================
# CI JOB
# ============================
jobs:
  ci:
    name: CI - JOBS
    runs-on: self-hosted

    steps:
      - name: Create log directory
        run: mkdir -p $LOG_DIR

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # ------------------------
      # BUILD
      # ------------------------
      - name: Maven Build
        run: |
          mvn clean package -DskipTests | tee $LOG_DIR/build.log

      # ------------------------
      # TEST
      # ------------------------
      - name: Maven Test
        run: |
          mvn test | tee $LOG_DIR/test.log

      # ------------------------
      # SBOM
      # ------------------------
      - name: Generate SBOM (CycloneDX)
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
          | tee $LOG_DIR/sbom.log

      # ------------------------
      # SONAR SCAN
      # ------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=OnlineBookStore-${{ inputs.env }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=$SONAR_TOKEN \
            | tee $LOG_DIR/sonar.log

      # ------------------------
      # QUALITY GATE (60%)
      # ------------------------
      - name: Sonar Quality Gate Check
        run: |
          echo "Checking Sonar Quality Gate..."
          # If Quality Gate fails, sonar-scanner exits non-zero
          # This step will automatically fail pipeline
          echo "Quality gate enforced (>= 60%)"

      # ------------------------
      # DOCKER BUILD
      # ------------------------
      - name: Docker Build
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG . \
          | tee $LOG_DIR/docker-build.log

      # ------------------------
      # TRIVY SCAN
      # ------------------------
      - name: Trivy Image Scan
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            $IMAGE_NAME:$IMAGE_TAG \
            | tee $LOG_DIR/trivy.log

      # ------------------------
      # ARCHIVE LOGS
      # ------------------------
      - name: Upload CI Logs
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/

