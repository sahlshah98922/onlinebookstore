name: Deploy to Oracle Linux Tomcat

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: self-hosted 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Maven se project build karke WAR file banana
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 3. WAR file ko safe name dena (onlinebookstore.war)
    - name: Rename WAR file
      run: mv target/*.war target/onlinebookstore.war

    # 4. Local Commands se file ko Worker Node par bhejna
    - name: Transfer and Deploy to Worker Node Tomcat
      run: |
        WORKER_IP="${{ secrets.SERVER_IP }}"
        WORKER_USER="${{ secrets.SERVER_USER }}"
        
        # Step A: Worker node ke tomcat se purani application saaf karein
        ssh -o StrictHostKeyChecking=no ${WORKER_USER}@${WORKER_IP} "rm -rf /home/sahil/tomcat/webapps/onlinebookstore.war /home/sahil/tomcat/webapps/onlinebookstore"
        
        # Step B: Nayi war file ko Master se Worker node par copy karein
        scp -o StrictHostKeyChecking=no target/onlinebookstore.war ${WORKER_USER}@${WORKER_IP}:/home/sahil/tomcat/webapps/
