name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

env:
  IMAGE_NAME: onlinebookstore
  IMAGE_TAG: ${{ github.sha }}
  LOG_DIR: /home/github/actions-runner/_work/ci-logs

jobs:
  ci:
    name: CI - JOBS
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # ------------------------
      # BUILD
      # ------------------------
      - name: Maven Build
        run: |
          set -o pipefail
          mvn clean package -DskipTests | tee $LOG_DIR/build.log

      # ------------------------
      # TEST
      # ------------------------
      - name: Maven Test
        run: |
          set -o pipefail
          mvn test | tee $LOG_DIR/test.log

      # ------------------------
      # SBOM
      # ------------------------
      - name: Generate SBOM (CycloneDX)
        run: |
          set -o pipefail
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            | tee $LOG_DIR/sbom.log
          
          # Copy actual SBOM report
          cp target/bom.xml $LOG_DIR/sbom.xml

      # ------------------------
      # SONAR SCAN
      # ------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          mvn sonar:sonar \
            -Dsonar.projectKey=OnlineBookStore-${{ inputs.env }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true \
            | tee $LOG_DIR/sonar.log

      # ------------------------
      # DOCKER BUILD
      # ------------------------
      - name: Docker Build
        run: |
          set -o pipefail
          docker build -t $IMAGE_NAME:$IMAGE_TAG . \
            | tee $LOG_DIR/docker-build.log

      # ------------------------
      # TRIVY SCAN
      # ------------------------
      - name: Trivy Image Scan
        run: |
          set -o pipefail
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            $IMAGE_NAME:$IMAGE_TAG \
            | tee $LOG_DIR/trivy.log

      # ------------------------
      # ARCHIVE LOGS + SBOM
      # ------------------------
      - name: Upload CI Logs
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /home/github/actions-runner/_work/ci-logs
