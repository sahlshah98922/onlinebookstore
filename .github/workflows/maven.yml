name: Parameterized CI Pipeline

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

env:
  IMAGE_NAME: onlinebookstore
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================
  # CI JOB
  # ============================
  ci:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Maven Build
        run: mvn clean package -DskipTests

      - name: Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=OnlineBookStore-${{ inputs.env }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Docker Build
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:${{ inputs.env }} \
            .

      - name: Trivy Scan
        run: |
          export PATH=$PATH:/usr/local/bin:/root/bin
          trivy image \
            --severity HIGH,CRITICAL \
            --format template \
            --template ./html.tpl \
            --output trivy-report.html \
            $IMAGE_NAME:$IMAGE_TAG

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.html

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG

          docker tag $IMAGE_NAME:${{ inputs.env }} ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ inputs.env }}
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ inputs.env }}

  # ============================
  # MANUAL APPROVAL (PAUSE HERE)
  # ============================
  approval:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: manual-approval

  # ============================
  # DEPLOY (RESUMES AFTER APPROVAL)
  # ============================
  deploy:
    needs: approval
    runs-on: self-hosted
    steps:
      - name: Mock Deployment
        run: echo "Deployment started after manual approvall"
