name: Deploy to Oracle Linux Tomcat

on:
  push:
    branches:
      - main # Jab aap code push karenge tab chalega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub ka cloud server use hoga

    steps:
    # 1. GitHub se code lena
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Java environment setup karna
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Apne Java version ke hisab se badlein
        distribution: 'temurin'
        cache: maven

    # 3. Maven se project build karke WAR file banana
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. WAR file ko safe name dena (onlinebookstore.war)
    - name: Rename WAR file
      run: mv target/*.war target/onlinebookstore.war

    # 5. SSH ke jariye file ko Oracle Linux server par push karna
    - name: Copy WAR file via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "target/onlinebookstore.war"
        target: "/home/sahil/tomcat/webapps/"
        strip_components: 1
