name: Deploy to Kubeadm Cluster (Dockerized)

on:
  push:
    branches:
      - main 

jobs:
  # ================= CI JOB =================
  build-and-push:
    # Custom name ki jagah default array labels ka use karein jo dono machine pe hain
    runs-on: [self-hosted, Linux, X64]
    name: Code Build and Docker Push
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/onlinebookstore:latest .

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/onlinebookstore:latest

  # ================= CD JOB =================
  deploy-to-kubeadm:
    needs: build-and-push
    # Yahan bhi default labels ka use karein
    runs-on: [self-hosted, Linux, X64]
    name: Kubernetes Cluster Deployment
    steps:
    - name: Checkout Manifests
      uses: actions/checkout@v4

    - name: Apply Kubernetes Manifests
      run: |
        # Kubeadm setup ko target karne ke liye kubectl command execute karein
        kubectl apply -f deployment.yaml
        kubectl rollout restart deployment/onlinebookstore
